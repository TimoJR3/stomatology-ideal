# nginx: сайт Ortodont Rashid на своём сервере.
# Перед установкой заменить ortodont-rashid.example на настоящий домен (2 места + пути к сертификату).
# Установка — см. deploy/SERVER.md.

# Ограничение нагрузки с одного IP: до 20 запросов в секунду (с запасом 40) и 30 соединений.
# Обычному посетителю этого хватает с избытком, а бот, который долбит сайт, получит ошибку 429.
limit_req_zone  $binary_remote_addr zone=ortodont_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ortodont_conn:10m;

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name ortodont-rashid.example www.ortodont-rashid.example;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ortodont-rashid.example$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ortodont-rashid.example www.ortodont-rashid.example;

    ssl_certificate     /etc/letsencrypt/live/ortodont-rashid.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortodont-rashid.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ortodont_ssl:10m;
    ssl_session_tickets off;

    root  /var/www/ortodont-rashid/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    # сайт статичный: никаких загрузок и тел запросов
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;

    limit_req  zone=ortodont_req burst=40 nodelay;
    limit_conn ortodont_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain;

    # служебные и скрытые файлы не отдаём
    location ~ /\.            { return 404; }
    location = /_headers      { return 404; }

    # контакт для кнопки «В контакты» на визитке
    location = /card/ortodont-rashid.vcf {
        include /etc/nginx/snippets/ortodont-rashid-security-headers.conf;
        types { }
        default_type "text/vcard; charset=utf-8";
        add_header Content-Disposition 'attachment; filename="ortodont-rashid.vcf"' always;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    # шрифты и библиотеки не меняются (версия в имени) — кэш на год
    location ~ ^/(fonts|vendor)/ {
        include /etc/nginx/snippets/ortodont-rashid-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/ortodont-rashid-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
