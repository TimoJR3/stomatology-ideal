# Заголовки защиты. Подключается в каждый location (include), потому что
# add_header во вложенном location отменяет заголовки родительского блока.
# Значения должны совпадать с src/_headers — это проверяет тест (npm test).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# ДЕМО: не показывать сайт в поиске. Удалить при запуске (и в src/_headers тоже).
add_header X-Robots-Tag "noindex, nofollow" always;
